name: Deploy public storefront preview

on:
  push:
    branches:
      - preview/storefront
    paths:
      - "web/**"
      - ".github/workflows/storefront-preview.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "storefront-preview"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload storefront
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./web"
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
