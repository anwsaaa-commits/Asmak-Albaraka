name: Build Asmak Albaraka Android Test APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create . --org com.asmak --project-name albaraka --platforms=android --no-pub
      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s, count = re.subn(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', s, count=1)
          if count != 1:
              raise SystemExit('Could not locate compileSdk setting in generated Android Gradle file')
          p.write_text(s)
          print('Android compileSdk set to 36')
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Set file_picker Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob
          import re
          cache = Path.home() / '.pub-cache'
          files = [Path(x) for x in glob.glob(str(cache / 'hosted' / 'pub.dev' / 'file_picker-*' / 'android' / 'build.gradle*'))]
          if not files:
              raise SystemExit('Could not locate file_picker Android Gradle file in Pub cache')
          changed = 0
          for path in files:
              source = path.read_text()
              updated, count = re.subn(
                  r'(?m)^(\\s*compileSdk(?:Version)?\\s*(?:=\\s*)?).+$',
                  r'\\g<1>36',
                  source
              )
              if count:
                  path.write_text(updated)
                  changed += count
                  print(f'Updated {path}')
          if changed == 0:
              for path in files:
                  print(f'No compileSdk declaration found in {path}')
              raise SystemExit('file_picker compileSdk declaration was not recognized; stopping safely')
          print(f'Updated {changed} file_picker compileSdk declaration(s) to 36')
          PY
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build debug test APK only
        run: flutter build apk --debug
      - name: Upload debug test APK
        uses: actions/upload-artifact@v4
        with:
          name: asmak-albaraka-debug-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
