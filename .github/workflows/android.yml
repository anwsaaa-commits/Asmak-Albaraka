name: Build Asmak Albaraka Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.ASMAK_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform with permanent application ID
        run: flutter create . --org com.asmak --project-name albaraka --platforms=android --no-pub
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Prepare permanent release signing key
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ASMAK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ASMAK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ASMAK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ASMAK_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/asmak-release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/asmak-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          python tool/configure_signing.py
      - name: Build signed release APK
        if: ${{ secrets.ASMAK_KEYSTORE_BASE64 != '' }}
        run: flutter build apk --release
      - name: Build test APK (not for official updates)
        if: env.HAS_RELEASE_KEY != 'true'
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HAS_RELEASE_KEY == 'true' && 'asmak-albaraka-signed-release-apk' || 'asmak-albaraka-debug-test-apk' }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
